<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crowzy promo</title>
<style>
@font-face{font-family:'Bricolage';src:url('node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');font-weight:200 800;}
@font-face{font-family:'Bricolage';src:url('node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-wght-normal.woff2') format('woff2');font-weight:200 800;unicode-range:U+0100-024F;}
@font-face{font-family:'Figtree';src:url('node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2') format('woff2');font-weight:300 900;}
:root{
  --i1:#4f46e5; --v1:#9b51e0; --v2:#c084fc; --o1:#ff5f3a; --p1:#e0408a;
  --grad: linear-gradient(90deg,#6d63ff 0%,#a855f7 45%,#e0408a 75%,#ff6a3d 100%);
  --card: rgba(255,255,255,.055); --line: rgba(255,255,255,.11);
  --ok:#34d399; --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden}
body{font-family:'Figtree',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#040309}
.blob{position:absolute;left:0;top:0;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;will-change:transform,opacity}
#g1{background:radial-gradient(circle, rgba(79,70,229,.85) 0%, rgba(79,70,229,.35) 30%, rgba(79,70,229,0) 68%)}
#g2{background:radial-gradient(circle, rgba(168,85,247,.8) 0%, rgba(168,85,247,.3) 32%, rgba(168,85,247,0) 66%)}
#g3{background:radial-gradient(circle, rgba(255,95,58,.7) 0%, rgba(224,64,138,.28) 34%, rgba(224,64,138,0) 66%)}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.display{font-family:'Bricolage',sans-serif;font-weight:750;letter-spacing:-.035em}
/* S1 / S9 lockup */
.lockup{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:34px;transform:translate(-50%,-50%)}
.lockup .bird{height:210px;width:auto;display:block}
.lockup .word{font-family:'Bricolage';font-weight:800;font-size:210px;letter-spacing:-.045em;line-height:1;display:flex;padding:0 .04em .12em 0}
.lockup .word span{display:inline-block}
.lockup .word .z{background:linear-gradient(90deg,#8b5cf6,#d946ef 55%,#ff5f3a);-webkit-background-clip:text;background-clip:text;color:transparent}
/* phone */
#phoneZoom{position:absolute;inset:0;transform-origin:960px 540px}
#phoneWrap{position:absolute;left:50%;top:50%;width:0;height:0;perspective:2200px}
#phone3d{position:absolute;left:-200px;top:-410px;width:400px;height:820px;transform-style:preserve-3d}
.edge{position:absolute;inset:0;border-radius:66px;background:linear-gradient(90deg,#55556a,#1d1d26 30%,#2a2a35 70%,#60607a)}
.front{position:absolute;inset:0;border-radius:66px;background:#050507;padding:13px;box-shadow:inset 0 0 0 2px #3c3c4a, inset 0 0 0 5px #0a0a0d}
.screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:#0b0918}
.wall{position:absolute;inset:0;background:
  radial-gradient(120% 70% at 20% 0%, rgba(99,90,255,.9), transparent 60%),
  radial-gradient(90% 60% at 100% 60%, rgba(217,70,239,.7), transparent 60%),
  radial-gradient(100% 60% at 10% 100%, rgba(255,106,61,.75), transparent 60%), #120c2a}
.status{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 34px;font-weight:650;font-size:17px}
.island{position:absolute;top:13px;left:50%;width:118px;height:34px;margin-left:-59px;background:#000;border-radius:20px}
.grid{position:absolute;top:84px;left:24px;right:24px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;justify-items:center}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.92);font-weight:500}
.ico{width:66px;height:66px;border-radius:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ico svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.crowzy{background:#fff}
.ico.crowzy img{height:44px}
.dock{position:absolute;left:14px;right:14px;bottom:14px;height:96px;border-radius:36px;background:rgba(255,255,255,.16);backdrop-filter:blur(20px);display:flex;justify-content:space-around;align-items:center}
.glare{position:absolute;inset:0;border-radius:54px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 44%,rgba(255,255,255,0) 58%);background-size:300% 100%}
.screenOff{position:absolute;inset:0;background:#000;border-radius:54px}
/* kinetic text */
.kt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:'Bricolage';font-weight:750;font-size:132px;letter-spacing:-.04em;line-height:1.05}
.kt .w{display:inline-block;margin:0 .12em;will-change:transform,filter,opacity;padding-bottom:.08em}
/* feed */
#feedPersp{position:absolute;left:50%;top:50%;width:0;height:0;perspective:1800px;transform:scale(1.38)}
#feed{position:absolute;left:-430px;top:0;width:860px;transform-style:preserve-3d}
.fhead{height:120px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 8px 22px}
.fhead .t{font-family:'Bricolage';font-weight:750;font-size:46px;letter-spacing:-.03em}
.fhead .s{font-size:22px;color:rgba(255,255,255,.6);margin-top:4px}
.card{position:relative;height:138px;margin-bottom:20px;border-radius:28px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 26px 0 20px;backdrop-filter:blur(18px)}
.thumb{width:98px;height:98px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center}
.thumb svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cinfo{flex:1;min-width:0}
.ctitle{font-family:'Bricolage';font-weight:700;font-size:31px;letter-spacing:-.02em;white-space:nowrap}
.cmeta{font-size:19px;color:rgba(255,255,255,.62);margin-top:6px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:7px;margin-top:10px;font-size:16px;font-weight:650;padding:5px 12px;border-radius:999px}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pill.warn{color:#fcd34d;background:rgba(251,191,36,.14)}
.pill.ok{color:#6ee7b7;background:rgba(52,211,153,.15)}
.pill.neu{color:#c4b5fd;background:rgba(167,139,250,.15)}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:none}
.price{font-family:'Bricolage';font-weight:700;font-size:30px}
.btn{position:relative;font-weight:700;font-size:19px;padding:12px 22px;border-radius:999px;background:linear-gradient(90deg,#4f46e5,#9b51e0);white-space:nowrap;display:flex;align-items:center;gap:8px;overflow:hidden}
.btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.btn .ok{position:absolute;inset:0;background:#10b981;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0}
.focusRing{position:absolute;inset:-2px;border-radius:30px;border:2px solid transparent;background:linear-gradient(90deg,#6d63ff,#c084fc,#ff6a3d) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0}
.cursor{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;z-index:5}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid rgba(255,255,255,.9);opacity:0;z-index:5}
/* min card */
#minPersp{position:absolute;left:50%;top:47%;width:0;height:0;perspective:2000px}
#minCard{position:absolute;left:-470px;top:-250px;width:940px;height:500px;border-radius:40px;background:rgba(255,255,255,.06);border:1px solid var(--line);backdrop-filter:blur(24px);padding:44px 48px;transform-style:preserve-3d}
.mhead{display:flex;gap:28px;align-items:center}
.mhead .thumb{width:120px;height:120px;border-radius:28px}
.mhead .thumb svg{width:58px;height:58px}
.mtitle{font-family:'Bricolage';font-weight:750;font-size:50px;letter-spacing:-.03em}
.mmeta{font-size:23px;color:rgba(255,255,255,.62);margin-top:8px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:46px}
.mlabel{font-size:24px;color:rgba(255,255,255,.75);font-weight:600}
.mcount{font-family:'Bricolage';font-weight:750;font-size:40px}
.bar{position:relative;height:22px;border-radius:999px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#4f46e5,#a855f7,#e0408a)}
.bar .fillOk{position:absolute;left:0;top:0;bottom:0;right:0;border-radius:999px;background:linear-gradient(90deg,#10b981,#34d399);opacity:0}
.avs{display:flex;margin-top:34px;align-items:center}
.av{width:62px;height:62px;border-radius:50%;border:3px solid #17122b;margin-left:-14px;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:24px}
.av:first-child{margin-left:0}
.avcap{margin-left:18px;font-size:22px;color:rgba(255,255,255,.65);white-space:nowrap}
.badge{position:absolute;right:48px;bottom:46px;display:flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;background:#10b981;font-weight:750;font-size:27px;box-shadow:0 10px 40px rgba(16,185,129,.45);opacity:0}
.badge svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.spark{position:absolute;width:12px;height:12px;border-radius:50%;margin:-6px 0 0 -6px;opacity:0}
.sub{position:absolute;left:0;right:0;text-align:center;font-size:40px;font-weight:600;color:rgba(255,255,255,.88);letter-spacing:-.01em}
/* publish form */
#formPersp{position:absolute;left:50%;top:50%;width:0;height:0;perspective:2000px}
#form{position:absolute;left:-430px;top:-330px;width:860px;height:660px;border-radius:40px;background:rgba(255,255,255,.06);border:1px solid var(--line);backdrop-filter:blur(24px);padding:44px 48px}
.ftitle{font-family:'Bricolage';font-weight:750;font-size:46px;letter-spacing:-.03em}
.fsub{font-size:21px;color:rgba(255,255,255,.6);margin-top:6px}
.field{margin-top:26px}
.flabel{font-size:18px;font-weight:650;color:rgba(255,255,255,.62);margin-bottom:10px}
.finput{height:68px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;padding:0 22px;font-size:26px;font-weight:600;gap:12px}
.finput svg{width:24px;height:24px;stroke:#c4b5fd;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.caret{display:inline-block;width:3px;height:32px;background:#a78bfa;margin-left:2px;vertical-align:middle}
.frow{display:flex;gap:18px}
.frow .field{flex:1}
.bigbtn{position:relative;margin-top:32px;height:76px;border-radius:999px;background:linear-gradient(90deg,#4f46e5,#9b51e0);display:flex;align-items:center;justify-content:center;font-weight:750;font-size:26px;overflow:hidden;box-shadow:0 12px 40px rgba(99,70,229,.45)}
.bigbtn .ok{position:absolute;inset:0;background:#10b981;display:flex;align-items:center;justify-content:center;gap:10px;opacity:0}
.bigbtn svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* notifications */
.notif{position:absolute;left:50%;width:760px;margin-left:-380px;height:118px;border-radius:34px;background:rgba(40,36,58,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px);display:flex;align-items:center;gap:20px;padding:0 26px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.nico{width:70px;height:70px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.nico img{height:46px}
.nbody{flex:1;min-width:0}
.ntop{display:flex;justify-content:space-between;font-size:19px;color:rgba(255,255,255,.6);font-weight:600}
.ntitle{font-size:24px;font-weight:750;margin-top:3px}
.ntext{font-size:22px;color:rgba(255,255,255,.85);margin-top:2px}
/* end */
.tagline{position:absolute;left:0;right:0;top:690px;text-align:center;font-size:44px;font-weight:600;letter-spacing:-.01em;color:rgba(255,255,255,.9)}
.url{position:absolute;left:50%;top:790px;transform:translateX(-50%);padding:14px 34px;border-radius:999px;font-family:'Bricolage';font-weight:700;font-size:34px;background:rgba(255,255,255,.06);border:1.5px solid rgba(192,132,252,.55)}
#grain{position:absolute;inset:0;width:1920px;height:1080px;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="glow"><div class="blob" id="g1"></div><div class="blob" id="g2"></div><div class="blob" id="g3"></div></div>

  <!-- S1 logo -->
  <div class="scene" id="s1">
    <div class="lockup" id="lock1"><img class="bird" src="assets/crowzy-logo.png"><div class="word" id="word1"></div></div>
  </div>

  <!-- S2 phone -->
  <div class="scene" id="s2"><div id="phoneZoom"><div id="phoneWrap"><div id="phone3d"></div></div></div></div>

  <!-- S3 text -->
  <div class="scene" id="s3"><div class="kt" id="kt1"></div></div>

  <!-- S4 feed -->
  <div class="scene" id="s4"><div id="feedPersp"><div id="feed"></div></div></div>

  <!-- S5 min -->
  <div class="scene" id="s5">
    <div id="minPersp"><div id="minCard"></div></div>
    <div class="sub" id="sub5" style="top:860px">Si no se llega al mínimo, no pagas.</div>
  </div>

  <!-- S6 text -->
  <div class="scene" id="s6"><div class="kt" id="kt2a"></div><div class="kt" id="kt2b"></div></div>

  <!-- S7 form -->
  <div class="scene" id="s7"><div id="formPersp"><div id="form"></div></div></div>

  <!-- S8 notifs -->
  <div class="scene" id="s8"><div id="notifs"></div><div class="kt" id="kt3" style="top:780px;font-size:96px"></div></div>

  <!-- S9 end -->
  <div class="scene" id="s9">
    <div class="lockup" id="lock9" style="top:430px"><img class="bird" src="assets/crowzy-logo.png"><div class="word" id="word9"></div></div>
    <div class="tagline" id="tag9">Actividades en tu ciudad. Apúntate o crea la tuya.</div>
    <div class="url" id="url9">crowzy.app</div>
  </div>

  <canvas id="grain" width="960" height="540"></canvas>
  <div id="vig"></div>
  <div id="fade"></div>
</div>
<script src="icons.js"></script>
<script>
const $=s=>document.querySelector(s);
const I=(n)=>`<svg viewBox="0 0 24 24">${ICONS[n]||''}</svg>`;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const E={
  lin:t=>t, outC:t=>1-Math.pow(1-t,3), inC:t=>t*t*t, ioC:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQ:t=>1-Math.pow(1-t,5), outX:t=>t===1?1:1-Math.pow(2,-10*t), inX:t=>t===0?0:Math.pow(2,10*t-10),
  ioX:t=>t===0?0:t===1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  outB:t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  ioQ:t=>t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2,
};
const tw=(t,t0,t1,v0,v1,e=E.outC)=>lerp(v0,v1,e(clamp((t-t0)/(t1-t0))));
function kf(t,fr){ if(t<=fr[0][0])return fr[0][1];
  for(let i=1;i<fr.length;i++){const[t1,v1,e]=fr[i],[t0,v0]=fr[i-1]; if(t<=t1){return lerp(v0,v1,(e||E.ioC)(clamp((t-t0)/((t1-t0)||1e-6))));}}
  return fr[fr.length-1][1];}
const st=(el,o)=>{for(const k in o)el.style[k]=o[k];};
const blur=b=>b>0.15?`blur(${b.toFixed(2)}px)`:'none';

/* ---------------- timing (seconds) ---------------- */
const T = window.T = {
  s1:[0,4.14], s2:[4.1,8.3], s3:[8.15,10.5], s4:[10.3,14.6], s5:[14.4,18.75],
  s6:[18.5,20.8], s7:[20.55,23.45], s8:[23.25,25.05], s9:[24.75,29.5], END:29.5,
  bpm:116, beat0:0, drop:4.138
};

/* ---------------- build DOM ---------------- */
function buildWord(el){ el.innerHTML='<span>C</span><span>r</span><span>o</span><span>w</span><span class="z">z</span><span class="z">y</span>'; }
buildWord($('#word1')); buildWord($('#word9'));

// phone
(function(){
  const p=$('#phone3d'); let h='';
  for(let i=14;i>=1;i--) h+=`<div class="edge" style="transform:translateZ(${-i*1.6}px)"></div>`;
  const apps=[['Calendario','calendar','#ff5f57,#ff2d55'],['Fotos','image','#ffd60a,#ff9f0a'],['Cámara','camera','#8e8e93,#48484a'],['Tiempo','cloud-sun','#5ac8fa,#007aff'],
    ['Mapas','compass','#34c759,#30b0c7'],['Música','music','#ff375f,#ff2d55'],['Notas','notebook-pen','#ffd60a,#ffcc00'],['Reloj','clock','#3a3a3c,#1c1c1e'],
    ['Cartera','wallet','#1c1c1e,#3a3a3c'],['Crowzy','*',''],['Salud','heart','#ff6482,#ff2d55'],['Ajustes','settings','#8e8e93,#636366'],
    ['Idiomas','languages','#0a84ff,#5e5ce6'],['Guardado','bookmark','#ff9f0a,#ff6b00'],['Bici','bike','#30d158,#248a3d'],['Buscar','search','#64d2ff,#0a84ff']];
  const appH=apps.map(([n,ic,c])=> ic==='*'
    ? `<div class="app" id="crowzyApp"><div class="ico crowzy" id="crowzyIco"><img src="assets/crowzy-logo.png"></div><span>${n}</span></div>`
    : `<div class="app"><div class="ico" style="background:linear-gradient(160deg,${c})">${I(ic)}</div><span>${n}</span></div>`).join('');
  const dock=[['phone','#34c759,#248a3d'],['message-circle','#34c759,#30d158'],['mail','#0a84ff,#5e5ce6'],['music','#ff375f,#ff2d55']]
    .map(([ic,c])=>`<div class="ico" style="background:linear-gradient(160deg,${c})">${I(ic)}</div>`).join('');
  h+=`<div class="front"><div class="screen"><div class="wall"></div><div class="island"></div>
      <div class="status"><span>9:41</span><span style="letter-spacing:2px">▮▮▮ ◖</span></div>
      <div class="grid">${appH}</div><div class="dock">${dock}</div>
      <div class="glare" id="glare"></div><div class="screenOff" id="scrOff"></div></div></div>`;
  p.innerHTML=h;
})();

// kinetic text helper
function words(el,html){ el.innerHTML=html.map(([w,g])=>`<span class="w ${g?'grad-text':''}">${w}</span>`).join(''); return [...el.querySelectorAll('.w')]; }
const W1=words($('#kt1'),[['Descubre'],['planes'],['<br>'],['en','g'],['tu','g'],['ciudad.','g']]);
const W2a=words($('#kt2a'),[['¿Tienes'],['una'],['idea?']]);
const W2b=words($('#kt2b'),[['Crea'],['la','g'],['tuya.','g']]);
const W3=words($('#kt3'),[['Mira'],['quién','g'],['se'],['apunta.']]);
[W1].forEach(a=>a.forEach(w=>{if(w.innerHTML==='<br>'){w.outerHTML='<br>';}}));
const W1b=[...$('#kt1').querySelectorAll('.w')];

// feed
const CAT={water:'#2563eb,#7c3aed', book:'#7c3aed,#db2777', music:'#db2777,#f97316', food:'#ea580c,#e11d48', mount:'#059669,#2563eb', art:'#9333ea,#f43f5e', sport:'#0891b2,#4f46e5', lang:'#4f46e5,#c026d3'};
const FEED=[
  ['Club de lectura en el parque','book-open','book','Dom 23 nov · 11:00 · Jardín del Turia','Gratis','neu','Abierta'],
  ['Concierto acústico en la azotea','music','music','Vie 21 nov · 21:30 · Ruzafa','8 €','ok','Confirmada'],
  ['Ruta por la sierra Calderona','mountain','mount','Sáb 22 nov · 08:00 · Náquera','Gratis','neu','Abierta'],
  ['Cena coreana para seis','utensils','food','Jue 20 nov · 20:30 · Benimaclet','18 €','warn','Faltan 3 para el mínimo'],

/* ---------------- grain ---------------- */
const gctx=$('#grain').getContext('2d'); const gimg=gctx.createImageData(960,540);
function grain(seed){ let s=(seed*2654435761)>>>0; const d=gimg.data;
  for(let i=0;i<d.length;i+=4){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; const v=s&255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  gctx.putImageData(gimg,0,0); }

/* ---------------- scene envelope ---------------- */
function scene(el,t,[a,b],o={}){
  const {inD=.45,outD=.4,inS=.9,outS=1.12,inB=26,outB=30,inE=E.outQ,outE=E.inC}=o;
  if(t<a||t>b){el.style.display='none';return null;}
  el.style.display='block';
  const pi=inE(clamp((t-a)/inD)), po=outE(clamp((t-(b-outD))/outD));
  const s=lerp(inS,1,pi)*lerp(1,outS,po), bl=inB*(1-pi)+outB*po, op=Math.min(pi*1.4,1)*(1-po);
  st(el,{transform:`scale(${s.toFixed(4)})`,filter:blur(bl),opacity:op.toFixed(3)});
  return {l:t-a, pi, po};
}
function wordsIn(ws,t,t0,stag=.09,d=.55,dy=50,b=18){
  ws.forEach((w,i)=>{const p=clamp((t-t0-i*stag)/d); const e=E.outQ(p);
    st(w,{opacity:Math.min(1,p*1.6).toFixed(3),transform:`translateY(${(dy*(1-e)).toFixed(2)}px) scale(${lerp(.92,1,e).toFixed(4)})`,filter:blur(b*(1-E.outC(p)))});});
}
function wordsOut(ws,t,t0,stag=.04,d=.3,dy=-40,b=16){
  ws.forEach((w,i)=>{const p=clamp((t-t0-i*stag)/d); if(p<=0)return; const e=E.inC(p);
    st(w,{opacity:(1-e).toFixed(3),transform:`translateY(${(dy*e).toFixed(2)}px)`,filter:blur(b*e)});});
}

/* ---------------- glow ---------------- */
function glow(t){
  const beat=60/T.bpm, ph=((t-T.beat0)/beat)%1, pulse=Math.exp(-ph*5)*.08;
  const set=(id,x,y,s,o)=>st($(id),{transform:`translate(${x}px,${y}px) scale(${s})`,opacity:clamp(o*(1+pulse)).toFixed(3)});
  // keyframes per scene: [t, value]
  const g1o=kf(t,[[0,0],[1.0,.75],[3.6,.8],[4.14,.3],[4.3,.85,E.outC],[5.5,.75],[8.0,.45],[8.4,.7],[10.3,.55],[14.5,.6],[16.55,.5],[18.6,.45],[20.6,.65],[23.3,.55],[24.9,.8],[28.4,.65],[29.5,0]]);
  const g1x=kf(t,[[0,960],[4.1,960],[5.5,820],[8.3,960],[10.3,700],[14.5,900],[18.6,960],[20.6,760],[23.3,960],[29.5,960]]);
  const g1y=kf(t,[[0,760],[1.4,600],[4.1,560],[5.5,520],[8.3,600],[10.3,480],[14.5,540],[18.6,600],[23.3,420],[25,540],[29.5,560]]);
  const g2o=kf(t,[[0,0],[1.6,.55],[4.1,.5],[5.7,.65],[8.3,.35],[10.5,.55],[14.5,.5],[16.4,.35],[18.6,.6],[23.3,.5],[25.3,.6],[28.6,.5],[29.5,0]]);
  const g2x=kf(t,[[0,1100],[4.1,1250],[6,1150],[10.3,1300],[14.5,1250],[18.6,1060],[20.6,1250],[25,1200],[29.5,1150]]);
  const g2y=kf(t,[[0,600],[4.1,500],[10.3,620],[14.5,420],[18.6,560],[23,640],[29.5,520]]);
  const g3o=kf(t,[[0,0],[2,.0],[3.6,.35],[6,.3],[8.3,.45],[10.5,.2],[16.4,.25],[16.7,.5],[18.6,.3],[20.6,.4],[23.3,.3],[25.3,.45],[29.5,0]]);
  const g3x=kf(t,[[0,800],[5.5,700],[10.3,1300],[14.5,700],[18.6,860],[23.3,1100],[25,760],[29.5,800]]);
  const g3y=kf(t,[[0,800],[8.3,700],[14.5,820],[18.6,680],[25,760],[29.5,740]]);
  set('#g1',g1x,g1y,kf(t,[[0,.6],[2,1],[26,1.1]]),g1o);
  set('#g2',g2x,g2y,.9,g2o); set('#g3',g3x,g3y,.85,g3o);
}

/* ---------------- render ---------------- */
let ICO_ORIGIN=null;
window.render=function(t,frame){
  glow(t);
  grain(frame||Math.floor(t*60)+1);

  /* S1 logo reveal */
  let r=scene($('#s1'),t,T.s1,{inD:.01,outD:.52,outS:1.8,outB:40,outE:E.inX});
  if(r){ const l=r.l, bird=$('#lock1 .bird'), word=$('#word1');
    const ww=word.offsetWidth+34; // shift so bird alone is centered
    const slide=tw(l,1.45,2.25,ww/2,0,E.ioQ);
    st(bird,{transform:`translateX(${slide}px) translateY(${tw(l,.1,1.3,40,0,E.outQ)}px) scale(${tw(l,.1,1.4,.55,1,E.outX)})`,
      filter:blur(tw(l,.1,1.15,40,0,E.outC)),opacity:tw(l,.1,.7,0,1)});
    const letters=[...word.children];
    st(word,{transform:`translateX(${slide}px)`,clipPath:`inset(-20% ${tw(l,1.5,2.35,100,-5,E.ioQ)}% -20% -5%)`});
    letters.forEach((s,i)=>{const p=clamp((l-1.55-i*.06)/.6),e=E.outQ(p);
      st(s,{transform:`translateX(${-60*(1-e)}px)`,filter:blur(14*(1-e)),opacity:Math.min(1,p*1.5)});});
  }

  /* S2 phone */
  r=scene($('#s2'),t,T.s2,{inD:.05,outD:.42,outS:1,outB:0,inB:0,inS:1,outE:E.outC});
  if(r){ const l=r.l, ph=$('#phone3d');
    const ry=kf(l,[[0,78],[1.05,-20,E.outX],[2.2,12,E.ioC],[3.1,0,E.ioC]]);
    const rx=kf(l,[[0,28],[1.05,6,E.outX],[2.2,-4],[3.1,0]]);
    const rz=kf(l,[[0,-10],[1.05,2,E.outX],[3.1,0]]);
    const ty=kf(l,[[0,620],[1.05,10,E.outX],[2.2,-6],[3.1,0]]);
    const sc=kf(l,[[0,.8],[1.05,1,E.outX]]);
    st(ph,{transform:`translateY(${ty}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${sc})`});
    st($('#glare'),{backgroundPosition:`${50+ry*1.6}% 0`});
    st($('#scrOff'),{opacity:tw(l,.5,.8,1,0,E.ioC)});
    const ico=$('#crowzyIco');
    const pop=kf(l,[[2.11,1],[2.36,1.16,E.outC],[2.65,1,E.ioC]]);
    st(ico,{transform:`scale(${pop})`,boxShadow:`0 0 ${tw(l,2.11,2.4,0,40)*(1-clamp((l-2.65)/.4))}px rgba(192,132,252,.9)`});
    // zoom into icon
    if(!ICO_ORIGIN){ const pr=ph.style.transform; ph.style.transform='none'; const b=ico.getBoundingClientRect(); ICO_ORIGIN=[b.left+b.width/2,b.top+b.height/2]; ph.style.transform=pr; }
    const z=kf(l,[[3.14,1],[4.12,20,E.inX]]);
    st($('#phoneZoom'),{transformOrigin:`${ICO_ORIGIN[0]}px ${ICO_ORIGIN[1]}px`,transform:`scale(${z})`,filter:blur(tw(l,3.75,4.18,0,10,E.inC))});
  }

  /* S3 kinetic text */
  r=scene($('#s3'),t,T.s3,{inD:.2,inB:0,inS:1,outD:.35});
  if(r){ wordsIn(W1b,t,8.28,.2586,.6,60,20);
    st($('#kt1'),{transform:`translateY(-50%) scale(${tw(r.l,0,2.35,.97,1.04,E.lin)})`}); }

  /* S4 feed */
  r=scene($('#s4'),t,T.s4,{inD:.45,outD:.45});
  if(r){ const l=r.l;
    // scroll: y offset of list so that target card is at center
    const centerOf=i=>HEAD_H+i*CARD_H+69;
    const yStart=-centerOf(0)+140, yEnd=-centerOf(FOCUS);
    const y=kf(l,[[0,yStart+260],[.6,yStart,E.outC],[2.11,yEnd,E.ioQ]]);
    const ry=kf(l,[[0,-24],[2.2,-12],[4.3,-6]]), rx=kf(l,[[0,16],[2.2,10],[4.3,6]]);
    st($('#feed'),{transform:`rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${kf(l,[[0,4],[4.3,1]])}deg) translateY(${y}px)`});
    const focusT=clamp((l-2.11)/.35);
    CARDS.forEach((c,i)=>{ const d=Math.abs(centerOf(i)+y); const isF=i===FOCUS;
      const dn=clamp(d/520); let b=Math.pow(dn,1.3)*10, op=1-dn*.75, sc=1-dn*.05, z=0;
      if(!isF){ b+=focusT*4; op*=1-focusT*.35; }
      else { const lift=E.outB(clamp((l-2.11)/.5)); sc*=lerp(1,1.07,lift); z=lerp(0,60,lift); }
      st(c,{filter:blur(b),opacity:op.toFixed(3),transform:`translateZ(${z}px) scale(${sc.toFixed(4)})`});
      if(isF){ c.querySelector('.focusRing').style.opacity=E.outC(focusT);
        const btn=c.querySelector('.btn'); const cur=$('#cur4'), rip=$('#rip4');
        const bx=btn.offsetLeft+btn.offsetWidth*0.55+btn.parentElement.offsetLeft, by=btn.offsetTop+btn.offsetHeight/2+btn.parentElement.offsetTop;
        const tapT=3.15;
        const cx=kf(l,[[2.4,bx+260],[3.02,bx,E.outQ]]), cy=kf(l,[[2.4,by+170],[3.02,by,E.outQ]]);
        const cs=kf(l,[[3.02,1],[tapT,.78,E.outC],[tapT+.15,1,E.outC]]);
        st(cur,{left:cx+'px',top:cy+'px',opacity:tw(l,2.4,2.65,0,1)*(1-tw(l,3.6,3.9,0,1)),transform:`scale(${cs})`});
        const rp=clamp((l-tapT)/.5); st(rip,{left:bx+'px',top:by+'px',opacity:rp>0?(1-rp)*.9:0,transform:`scale(${1+rp*2.2})`});
        btn.style.transform=`scale(${kf(l,[[3.02,1],[tapT,.92,E.outC],[tapT+.25,1,E.outB]])})`;
        btn.querySelector('.ok').style.opacity=tw(l,tapT+.05,tapT+.25,0,1);
        const pill=c.querySelector('.pill'); if(l>tapT+.15){ pill.className='pill warn'; pill.querySelector('span').textContent='Falta 1 para el mínimo'; } else { pill.className='pill warn'; pill.querySelector('span').textContent='Faltan 2 para el mínimo'; }
      }
    });
    st($('#fhead'),{opacity:clamp(1-Math.abs(HEAD_H/2+y)/400).toFixed(3),filter:blur(clamp(Math.abs(HEAD_H/2+y)/400)*10)});
  }

  /* S5 minimum */
  r=scene($('#s5'),t,T.s5,{inD:.5,outD:.4,inS:.86});
  if(r){ const l=r.l;
    st($('#minCard'),{transform:`rotateY(${kf(l,[[0,-16],[4.35,9]])}deg) rotateX(${kf(l,[[0,10],[4.35,-4]])}deg)`});
    const s1=1.12, s2=1.63; // steps 6->7->8
    const step=l<s1?6:l<s2?7:8; $('#mc').textContent=step;
    const fp=kf(l,[[.5,6/8],[s1,6/8],[s1+.25,7/8,E.outQ],[s2,7/8],[s2+.25,1,E.outQ]]);
    $('#mfill').style.width=(fp*100)+'%';
    const okT=2.15; $('#mfillOk').style.opacity=tw(l,okT,okT+.3,0,1);
    AVEL.forEach((a,i)=>{ let p=1; if(i===6)p=clamp((l-s1)/.45); if(i===7)p=clamp((l-s2)/.45); if(i<6)p=clamp((l-.2-i*.05)/.45);
      st(a,{transform:`scale(${E.outB(p)})`,opacity:Math.min(1,p*2)}); });
    $('#avcap').textContent= l<okT? 'van a ir' : 'van a ir · ¡Mínimo alcanzado!';
    const bp=clamp((l-okT)/.5);
    st($('#badge'),{opacity:Math.min(1,bp*2.5),transform:`scale(${E.outB(bp)}) translateY(${(1-E.outQ(bp))*20}px)`});
    SPARKS.forEach((s,i)=>{const a=i/16*Math.PI*2+.2, p=clamp((l-okT-.05)/.8), d=E.outQ(p)*(150+ (i%3)*40);
      st(s,{transform:`translate(${Math.cos(a)*d*1.6}px,${Math.sin(a)*d*.8}px) scale(${1-p*.6})`,opacity:p>0?(1-p):0});});
    const sp=clamp((l-(okT+.52))/.6); st($('#sub5'),{opacity:sp,transform:`translateY(${(1-E.outQ(sp))*30}px)`,filter:blur(10*(1-E.outC(sp)))});
  }

  /* S6 text */
  r=scene($('#s6'),t,T.s6,{inD:.2,inB:0,inS:1,outD:.35});
  if(r){ const a=T.s6[0];
    wordsIn(W2a,t,18.62,.17,.55,60,20); const sw=19.45; wordsOut(W2a,t,sw,.05,.3,-60,18);
    W2b.forEach(w=>w.style.opacity=0); if(t>19.66) wordsIn(W2b,t,19.66,.2586,.6,70,22);
    $('#kt2a').style.display=t>sw+.5?'none':'block';
  }

  /* S7 form */
  r=scene($('#s7'),t,T.s7,{inD:.5,outD:.4,inS:.88});
  if(r){ const l=r.l;
    st($('#form'),{transform:`rotateY(${kf(l,[[0,14],[2.9,-8]])}deg) rotateX(${kf(l,[[0,8],[2.9,-2]])}deg)`});
    FIELDS.forEach((f,i)=>{const p=clamp((l-.15-i*.09)/.5); st(f,{opacity:Math.min(1,p*1.6),transform:`translateY(${(1-E.outQ(p))*40}px)`,filter:blur(10*(1-E.outC(p)))});});
    const n=Math.floor(clamp((l-.55)/.75)*TITLE.length); $('#ftype').textContent=TITLE.slice(0,n);
    $('#caret').style.opacity= (l<1.4? 1 : (Math.floor(l*3)%2?0:1));
    const tapT=2.21;
    st($('#cur7'),{opacity:tw(l,1.6,1.85,0,1)*(1-tw(l,2.65,2.9,0,1)),transform:`translate(${kf(l,[[1.6,240],[2.1,0,E.outQ]])}px,${kf(l,[[1.6,140],[2.1,0,E.outQ]])}px) scale(${kf(l,[[2.1,1],[tapT,.78],[tapT+.15,1]])})`});
    const rp=clamp((l-tapT)/.5); st($('#rip7'),{opacity:rp>0?(1-rp)*.9:0,transform:`scale(${1+rp*2.4})`});
    $('#pubBtn').style.transform=`scale(${kf(l,[[2.1,1],[tapT,.95],[tapT+.25,1,E.outB]])})`;
    $('#pubBtn .ok').style.opacity=tw(l,tapT+.05,tapT+.25,0,1);
  }

  /* S8 notifications */
  r=scene($('#s8'),t,T.s8,{inD:.25,inB:0,inS:1,outD:.4});
  if(r){ const l=r.l; const starts=[.03,.54,1.06];
    NEL.forEach((n,i)=>{ const p=clamp((l-starts[i])/.5), e=E.outB(p);
      const newer=starts.filter((s,j)=>j>i).map(s=>E.outQ(clamp((l-s)/.45))).reduce((a,b)=>a+b,0);
      const y=lerp(-160,260,E.outQ(p)) + newer*134;
      const sc=(1-newer*.05)*lerp(.9,1,e);
      st(n,{top:y+'px',transform:`scale(${sc})`,opacity:Math.min(1,p*2)*(1-newer*.18),filter:blur(newer*1.6+(1-E.outC(p))*8),zIndex:10+i}); });
    wordsIn(W3,t,23.9,.13,.55,50,18);
  }

  /* S9 end */
  r=scene($('#s9'),t,T.s9,{inD:.5,outD:.01,inS:.8,inB:30});
  if(r){ const l=r.l, bird=$('#lock9 .bird'), word=$('#word9');
    st(bird,{transform:`scale(${tw(l,0,.8,.7,1,E.outX)}) rotate(${tw(l,0,.8,-8,0,E.outQ)}deg)`});
    [...word.children].forEach((s,i)=>{const p=clamp((l-.15-i*.05)/.55),e=E.outQ(p); st(s,{transform:`translateY(${50*(1-e)}px)`,filter:blur(14*(1-e)),opacity:Math.min(1,p*1.5)});});
    const tp=clamp((l-1.11)/.6); st($('#tag9'),{opacity:tp,transform:`translateY(${(1-E.outQ(tp))*24}px)`,filter:blur(8*(1-E.outC(tp)))});
    const up=clamp((l-1.63)/.6); st($('#url9'),{opacity:up,transform:`translateX(-50%) translateY(${(1-E.outQ(up))*20}px) scale(${lerp(.9,1,E.outB(up))})`});
    st($('#lock9'),{transform:`translate(-50%,-50%) scale(${tw(l,.5,4.7,1,1.04,E.lin)})`});
  }
  $('#fade').style.opacity=Math.max(tw(t,0,.35,1,0,E.lin), tw(t,T.END-.55,T.END,0,1,E.inC));
};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))));
